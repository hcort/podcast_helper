<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Podcast Helper{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><main>
<nav aria-label="Navegación principal">
<a href="{{ url_for('podcasts.index') }}" {% if request.blueprint == 'podcasts' %}aria-current="page"{% endif %}>Podcasts</a>
<a href="{{ url_for('videos.index') }}" {% if request.blueprint == 'videos' %}aria-current="page"{% endif %}>Vídeos</a>
<a href="{{ url_for('history.index') }}" {% if request.blueprint == 'history' %}aria-current="page"{% endif %}>Historial</a>
</nav>
{% block content %}{% endblock %}
<section id="progress-panel" hidden aria-label="Progreso de descargas">
<h2>Progreso de las descargas</h2><p id="progress-status" role="status"></p>
<pre id="progress-log" tabindex="0" aria-label="Salida de consola"></pre>
</section>
<script src="{{ url_for('static', filename='progress.js') }}" defer></script>
</main></body></html>
