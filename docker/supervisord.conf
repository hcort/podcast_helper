[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/podcast-supervisor/supervisord.pid

[program:web]
command=/usr/local/bin/gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 --timeout 0 flask_entry_point:app
directory=/app
user=podcast
environment=HOME="/home/podcast",USER="podcast"
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files=/run/podcast-supervisor/*.conf
