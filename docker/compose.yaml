services:
  podcast-helper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PODCAST_UID: ${PODCAST_UID:-1000}
        PODCAST_GID: ${PODCAST_GID:-1000}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - podcast-output:/srv/sftp/downloads
      - podcast-ssh:/var/lib/podcast-ssh
    shm_size: 1gb
    restart: unless-stopped
volumes:
  podcast-output:
  podcast-ssh:
